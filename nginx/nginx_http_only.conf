# File         : nginx.cofig HTTP ONLY
# Description  : http access only
# Server       :
# Folder       : <Docker>/ngix
# Auth         : Mina Milad - Oct. 2025
# ============================================================================

# Info. read From .env File through docker-compose.yaml file
    # DOMAIN_CER
    # DOMAIN_KEY
    # FRONT_END_FOLDER
    # SRV_DOMAIN

# Related setting in docker-comose.yaml File
    # log and cach setting
        # - ./nginx/error_log.log:/etc/nginx/error_log.log
        # - ./nginx/access_log.log:/etc/nginx/access_log.log
        # - ./nginx/cache/:/etc/nginx/cache

# Global Settings
    # User www-data is create by nignix in Debian deisto, no access user.
    user www-data;

    # Num of process
    worker_processes auto;

    # process ID (PID) of the NGINX master process should be stored.
    pid /run/nginx.pid;

events {
    # Default is 768 no need to set
    worker_connections 1024;
    # attempt to accept multiple connections simultaneously, default off
    multi_accept on;
}

http {

    ##
    # Basic Settings
    ##

    sendfile on;

    # try to send the HTTP response headers and the first part of the response
    # body together, without waiting for more data to become available.
    tcp_nopush on;

    types_hash_max_size 2048;
    # server_tokens off;

    # server_names_hash_bucket_size 64;
    # server_name_in_redirect off;

    # no need include /etc/nginx/mime.types;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # SSL Settings
    ##

    # ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
    # ssl_prefer_server_ciphers on;

    ##
    # Logging Settings
    ##
    # Note set in docker-compose (see above)

    # Define log formats for access_log, error_log has its own
    log_format aym_log '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /etc/nginx/access_log.log aym_log;
    error_log /etc/nginx/error_log.log debug;

    # Return 403, if size is more than 20m
    client_max_body_size 20m;

    # Note set in docker-compose (see above)
    proxy_cache_path /etc/nginx/cache keys_zone=one:500m max_size=1000m;

    ##
    # Gzip Settings
    ##

    gzip on;

    # gzip_vary on;     adds the "Vary: Accept-Encoding"
    # gzip_proxied any;
    # gzip_comp_level 6;  default is 6
    # gzip_buffers 16 8k;
    # gzip_http_version 1.1;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    ##
    # Virtual Host Configs
    ##

    # Default server configuration
    ##

    # duration for connection between Nginx and a client (like a web browser)
    #  will be kept open on the server side.

    # keepalive_timeout 3600s; in backend
    keepalive_timeout 65s;

    server {
        # you should configure your system to support both IPv4 and IPv6
        # Usage: IPv6 is designed to replace IPv4
        listen 80;         # Listen on port 80 for IPv4
        listen [::]:80;    # Listen on port 80 for IPv6
        server_name $SRV_DOMAIN;
# ------------------------------------
        # folder has frontend docker as the link in yaml file
        root /srv/web;
        index index.html index.htm;

        # remove cahe
        # kill cache
        add_header Last-Modified $date_gmt;
        add_header Cache-Control 'no-store, no-cache';
        if_modified_since off;
        expires off;
        etag off;
        #------------

        # applies to any URI starting with /. The ^~ modifier ensures location block is matched
        #  preferentially over regex locations.

        location ^~ / {
            # removed index index.html index.htm;
            try_files $uri $uri/ @rewrites;
            # try_files $uri $uri/ /index.html;
            # try_files $uri $uri/ =404;
        }

        # rewrites any request that reaches this block to /index.html.
        # The last flag indicates that the rewrite should be the final processing step

        location @rewrites {
           rewrite ^.*$ /index.html last;
        }

        # for apple app default association
        location = /.well-known/apple-app-site-association {
            root /srv/web;  # Ensure this is the correct path where the file is stored
            default_type application/json;
        }
    }
}
